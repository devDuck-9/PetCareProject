# application.properties

spring.application.name=petcareproject

# 기본 실행 프로파일
spring.profiles.active=local

# 한글 인코딩
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Thymeleaf
spring.thymeleaf.cache=false

# 파일 업로드 (공통)
# 파일 한 개 당 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 요청당 최대 파일 크기 - 10MB 10개까지
spring.servlet.multipart.max-request-size=100MB

# MyBatis (공통)
mybatis.type-aliases-package=com.duck.petcareproject.domain
mybatis.mapper-locations=classpath:mappers/**/*Mapper.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 업로드 디렉토리 기본값(없으면 프로젝트 내 uploads 사용)
# Windows/리눅스 어디서든 최소 실행은 되게 만드는 용도
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# 로그 레벨 [중요한 흐름만 출력 (기본/운영 친화)]
logging.level.org.springframework.security=INFO

# 정적 파일 변경 실시간 반영
spring.devtools.remote.restart.enabled=false
spring.devtools.livereload.enabled=true