<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
			xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
			layout:decorate="~{layouts/main_layout}">

<th:block layout:fragment="content">
	
	<link rel="stylesheet" th:href="@{/css/community/post_form.css}"/>
	<link rel="stylesheet" th:href="@{/css/community/post_detail.css}"/>
	<link rel="stylesheet" th:href="@{/css/components/modal.css}"/>

	<main class="comm-page">
		<section class="comm-shell">

			<!-- 왼쪽 사이드바 -->
			<div th:replace="~{fragments/community_sidebar :: communitySidebar(${post != null ? post.category : 'ALL'})}"></div>

			<!-- 오른쪽 : 상세 카드 -->
			<div class="comm-main">
				<article class="comm-card">

						<!-- 상단 헤더 -->
						<header class="pd-head">
							<div class="pd-head-top">
								<div class="pd-badges">
									<span class="pd-badge pd-badge--sub" th:text="${post != null ? post.category.label : 'FREE'}">게시판 카테고리</span>
								</div>

								<div class="pd-actions">
									<a class="btn-pill" th:href="@{/community}" title="목록">목록</a>
									
									<!-- 내 글일 때만 노출 isOwner -->
									<a class="btn-pill" th:if="${isOwner}" th:href="@{/updatePost/{id}(id=${post.postSeq})}">수정</a>
									<button type="button" class="btn-pill pd-btn-danger" th:if="${isOwner}" th:data-post-seq="${post.postSeq}" id="btnDeletePost">삭제</button>
									<input type="hidden" id="returnUrl" name="returnUrl" th:value="${returnUrl}">
								</div>
							</div>

							<h1 class="pd-title" th:text="${post != null ? post.title : '게시글 제목'}">게시글 제목</h1>

							<div class="pd-meta">
								<div class="pd-meta-left">
									<span class="pd-writer">
										<i class="bi bi-person-circle"></i>
										<span th:text="${post != null ? post.userName : '작성자'}">작성자</span>
									</span>
									<span class="pd-dot">•</span>
									<span class="pd-date" th:text="${post != null && post.createdAt != null ? #temporals.format(post.createdAt,'yyyy.MM.dd HH:mm') : ''}"></span>
								</div>
								<div class="pd-meta-right">
									<span class="pd-metric" title="조회수">
										<i class="bi bi-eye"></i>
										<span th:text="${post != null ? post.viewCount : 0}">0</span>
									</span>
									<span class="pd-metric" title="댓글">
										<i class="bi bi-chat-dots"></i>
										<span th:text="${post != null && post.commentCount != null ? post.commentCount : 0}">0</span>
									</span>
								</div>
							</div>
					</header>

					<!-- 본문 -->
					<section class="pd-body">
						<!-- 줄바꿈 유지 -->
						<div class="pd-content" th:utext="${post != null ? #strings.replace(#strings.escapeXml(post.content), '\n', '<br/>') : ''}"></div>

						<div class="pd-mini-actions">
							<button type="button" class="btn-pill" id="btnScrollComment">
								<i class="bi bi-chat"></i> 댓글로
							</button>
						</div>
					</section>

					<!-- 댓글 -->
					<section class="pd-comments" id="commentSection">
						<div class="pd-comments-head">
							<div class="pd-comments-title">
								<span class="comm-paw">🐾</span> 댓글
								<span class="pd-comments-count" th:text="${post != null && post.commentCount != null ? post.commentCount : 0}">0</span>
							</div>
						</div>

						<!-- 댓글 작성 -->
						<form class="pc-form" th:action="@{/insertComment}" method="post" id="commentForm">
							<input type="hidden" name="postSeq" th:value="${post != null ? post.postSeq : 0}">
							<div class="pc-input-wrap">
								<textarea class="pc-textarea" name="content" id="commentContent" rows="3" placeholder="따뜻한 한마디를 남겨주세요 😊"></textarea>
								<div class="pc-input-foot">
									<span class="pc-counter" id="commentCounter">0/300</span>
									<button type="submit" class="btn-pill-orange">등록</button>
								</div>
							</div>
						</form>

							<!-- 댓글 리스트 -->
							<div class="pc-list">
								<!--
										컨트롤러에서 comments(List<CommunityCommentDTO>) 같은 걸 넘긴다고 가정.
										지금은 UI만 만들어두고, 나중에 th:each만 살리면 됨.
								-->
								<div class="pc-item" th:each="c : ${comments}">
									<div class="pc-item-head">
										<div class="pc-item-writer">
											<i class="bi bi-person-circle"></i>
											<span th:text="${c.userName}">작성자</span>
										</div>
										<div class="pc-item-date" th:text="${c.createdAt != null ? #temporals.format(c.createdAt,'yyyy.MM.dd HH:mm') : ''}"></div>
									</div>
									<div class="pc-item-body" th:text="${c.content}">댓글 내용</div>

									<!-- 내 댓글일 때만 노출 -->
									<div class="pc-item-actions" th:if="${c.isOwner}">
										<a class="pc-link" th:href="@{/updateCommentForm(commentSeq=${c.commentSeq})}">수정</a>
										<button type="button" class="pc-link pc-link--danger" data-comment-delete th:attr="data-comment-seq=${c.commentSeq}">삭제</button>
									</div>
								</div>

								<!-- 댓글이 없을 때 -->
								<div class="pc-empty" th:if="${comments == null || #lists.isEmpty(comments)}">
									아직 댓글이 없어요. 첫 댓글의 주인공이 되어주세요 🐶
								</div>
							</div>
					</section>

				</article>
			</div>

		</section>
	</main>

	<!-- 안내 모달 -->
	<div th:replace="~{fragments/modal :: modal('postModal', '알림')}"></div>
	<!-- 액션 모달 (삭제 확인 등) -->
	<div th:replace="~{fragments/modal :: actionModal('confirmModal', '알림')}"></div>

	<script th:src="@{/js/components/modal.js}"></script>
	<script>
			Modal.bind('#postModal');
			Modal.bind('#confirmModal');
	</script>
	<script th:src="@{/js/community/post_detail.js}"></script>
	<script th:src="@{/js/common.js}"></script>
</th:block>
</html>
