<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
			xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
			layout:decorate="~{layouts/main_layout}">

<th:block layout:fragment="content">

	<link rel="stylesheet" th:href="@{/css/community/post_edit.css}"/>
	<link rel="stylesheet" th:href="@{/css/community/post_form.css}"/>
	<link rel="stylesheet" th:href="@{/css/components/modal.css}"/>

	<main class="comm-page">
		<section class="comm-shell">

			<!-- 왼쪽 사이드바 -->
			<div th:replace="~{fragments/community_sidebar :: communitySidebar(${post != null ? post.category.name() : 'ALL'})}"></div>

			<!-- 오른쪽 : 글수정 카드 -->
			<div class="comm-main">
				<div class="comm-card">

					<div class="comm-card-head">
						<div class="comm-card-title">
							<span class="comm-paw">🐾</span> 글 수정
						</div>
					</div>

					<div class="comm-card-body">
						<form id="postEditForm" th:action="@{/updatePost/{id}(id=${post.postSeq})}" method="post" enctype="multipart/form-data">
							<input type="hidden" name="postSeq" th:value="${post != null ? post.postSeq : 0}">

							<!-- 카테고리 -->
							<div class="cf-row">
								<div class="cf-label">카테고리</div>

								<select class="cf-select" name="category" id="categorySelect">
									<option value="FREE" th:selected="${post != null && post.category.name() == 'FREE'}">자유 게시판</option>
									<option value="INFO" th:selected="${post != null && post.category.name() == 'INFO'}">정보 공유</option>
									<option value="BOAST" th:selected="${post != null && post.category.name() == 'BOAST'}">자랑 하기</option>
									<option value="QNA"	th:selected="${post != null && post.category.name() == 'QNA'}">질문 &amp; 답변</option>
								</select>
							</div>

							<!-- 제목 -->
							<div class="cf-row">
								<div class="cf-label">제목 <span class="is-required-span">*</span></div>

								<div class="cf-field has-counter is-input">
									<input class="cf-input is-required" type="text" name="title" id="title" maxlength="100" th:value="${post != null ? post.title : ''}" placeholder="제목을 입력해주세요.">
									<span class="inline-counter" id="titleCounter">0/100</span>
								</div>
							</div>
							
							<!--	기존 이미지 삭제 목록(서버로 보낼 hidden) -->
							<div id="removeOldInputs"></div>
			
							<!--	사진 (등록폼과 동일 UI) -->
							<div class="cf-row">
								<div class="cf-label">사진</div>
								<div class="cf-field">
									<input type="file" name="images" id="images" accept="image/*" multiple style="display:none;">
									<button type="button" class="btn-pill" id="btnPickImages">파일 선택</button>
									<span id="fileLabel" style="margin-left:10px; font-size:13px; color:#666;">선택된 파일 없음</span>
									<div id="imagePreview" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;"></div>
								</div>
							</div>
						
							<!-- 본문 -->
							<div class="cf-row">
								<div class="cf-label">본문 <span class="is-required-span">*</span></div>

								<div class="cf-field has-counter is-textarea">
									<textarea class="cf-textarea is-required" name="content" id="content" maxlength="10000" placeholder="내용을 입력해주세요." th:text="${post != null ? post.content : ''}"></textarea>
									<span class="inline-counter" id="contentCounter">0/10000</span>
								</div>
							</div>
							
							<!-- 버튼 -->
							<div class="cf-actions">
								<button type="submit" class="btn-pill-orange">저장</button>
								<button type="button" class="btn-pill" onclick="confirmCancelWithModal('#confirmModal','수정을 취소할까요?<br>변경사항이 저장되지 않습니다.')">취소</button>
							</div>
						</form>
					</div>

				</div>
			</div>

		</section>
	</main>

	<!-- 알림 모달 -->
	<div th:replace="~{fragments/modal :: modal('postModal', '알림')}"></div>
	<!-- 취소 확인 모달 -->
	<div th:replace="~{fragments/modal :: actionModal('confirmModal', '알림')}"></div>

	<script th:src="@{/js/components/modal.js}"></script>
	<script>
			Modal.bind('#postModal');
			Modal.bind('#confirmModal');
	</script>
	
	<!--	서버에서 내려준 기존 이미지 목록을 JS로 넘기기 -->
	<script th:inline="javascript">
		window.__OLD_IMAGES__ = /*[[${images}]]*/ [];
	</script>


	<script th:src="@{/js/community/post_edit.js}"></script>
	<script th:src="@{/js/common.js}"></script>
</th:block>
</html>
