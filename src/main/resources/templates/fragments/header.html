<div th:fragment="header" class="pc-header" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<div class="pc-header-inner">

		<!-- 왼쪽: 로고 -->
		<a class="pc-logo" th:href="@{/}">
			<img th:src="@{/images/logo.png}" alt="PetCare">
		</a>

		<!-- 가운데: 메뉴 -->
		<nav class="pc-nav">
			<a th:href="@{/}" th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">홈</a>
			<a th:href="@{/community}" th:classappend="${activeMenu == 'community'} ? 'active' : ''">커뮤니티</a>
			<a th:href="@{/hospital}" th:classappend="${activeMenu == 'hospital'} ? 'active' : ''">병원정보</a>
		</nav>

		<!-- 오른쪽 -->
		<div class="pc-user">
			 <!-- 로그인 전 -->
			<th:block sec:authorize="isAnonymous()">
				<a class="pc-login-btn" th:href="@{/loginForm}">로그인</a>
				<a class="pc-login-btn ms-4" th:href="@{/joinForm}">회원가입</a>
			</th:block>

			<!-- 로그인 후 -->
			<th:block sec:authorize="isAuthenticated()">
				
				<!-- 관리자: 로그아웃 버튼만 -->
				<th:block sec:authorize="hasRole('ADMIN')">
					<a class="pc-login-btn" th:href="@{/logout}">로그아웃</a>
				</th:block>
				
				<!-- 일반 사용자: 프로필 드롭다운 -->
				<th:block sec:authorize="!hasRole('ADMIN')">
					<div class="pc-profile-dd" id="profileDD">
	
						<button type="button" class="pc-profile-dd__btn" id="profileBtn" aria-expanded="false" th:classappend="${activeMenu == 'mypage'} ? ' is-active' : ''" >
							프로필 <span class="pc-profile-dd__caret">▼</span>
						</button>
	
						<div class="pc-profile-dd__menu" id="profileMenu" role="menu" aria-hidden="true">
							<a class="pc-profile-dd__item" th:href="@{/mypage}">내정보</a>
							<a class="pc-profile-dd__item" th:href="@{/logout}" role="menuitem">로그아웃</a>
						</div>
	
					</div>
					
					<script>
						(function () {
							const wrap = document.getElementById('profileDD');
							const btn	= document.getElementById('profileBtn');
							const menu = document.getElementById('profileMenu');
							if (!wrap || !btn || !menu) return;
	
							function openMenu() {
								menu.classList.add('open');
								btn.setAttribute('aria-expanded', 'true');
								menu.setAttribute('aria-hidden', 'false');
							}
	
							function closeMenu() {
								menu.classList.remove('open');
								btn.setAttribute('aria-expanded', 'false');
								menu.setAttribute('aria-hidden', 'true');
							}
	
							btn.addEventListener('click', function (e) {
								e.preventDefault();
								const isOpen = menu.classList.contains('open');
								if (isOpen) closeMenu();
								else openMenu();
							});
	
							// 바깥 클릭 닫기
							document.addEventListener('click', function (e) {
								if (!e.target.closest('#profileDD')) closeMenu();
							});
	
							// ESC 닫기
							document.addEventListener('keydown', function (e) {
								if (e.key === 'Escape') closeMenu();
							});
						})();
					</script>
				</th:block>
					
			</th:block>
			
		</div>

	</div>
	
	<!-- 일정 알림 토스트 컨테이너 -->
	<div id="scheduleToast" class="pc-toast" style="display:none;">
		<div class="pc-toast__head">
			<div class="pc-toast__title">내일 일정이 있습니다.</div>
			<button type="button" class="pc-toast__x" id="btnToastClose">[X]</button>
		</div>

		<ul class="pc-toast__list" id="scheduleToastList"></ul>

		<div class="pc-toast__foot">
			<div class="pc-toast__more" id="scheduleToastMore"></div>
			<button type="button" class="pc-toast__btn" id="btnToastDismissToday">[오늘만 알림 끄기]</button>
		</div>
	</div>

</div>
