<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
			xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
			layout:decorate="~{layouts/main_layout}">
<th:block layout:fragment="content">

	<link rel="stylesheet" th:href="@{/css/mypage.css}">
	<link rel="stylesheet" th:href="@{/css/password.css}">

	<main class="mp2-page">
		<section class="mp2-shell">
			<div class="mp2-grid">

				<!-- ============ LEFT ============ -->
				<aside class="mp2-left">
					<div class="mp2-profileBox">
						<div class="mp2-avatar">
							<img id="profileImg"
									 th:src="${profileMember != null && profileMember.profileImg != null ? profileMember.profileImg : '/images/profile.png'}"
									 alt="프로필">
						</div>

						<button type="button" class="mp2-gear" id="btnProfilePhoto" aria-label="프로필 사진 변경" title="프로필 사진 변경">
							<i class="bi bi-gear-fill"></i>
						</button>

						<input type="file" id="profileFile" accept="image/*" style="display:none;">
					</div>

					<div class="mp2-userPill" th:text="${profileMember != null && profileMember.userName != null ? profileMember.userName : '닉네임 설정이 필요합니다'}">
						이름
					</div>

					<nav class="mp2-menu" aria-label="마이페이지 메뉴">
						<a class="mp2-menuItem is-active" th:href="@{/mypage}">내정보</a>
						<a class="mp2-menuItem" th:href="@{/community/myPosts}">내가 쓴 게시글</a>
						<a class="mp2-menuItem danger" th:href="@{/member/withdraw}">회원탈퇴</a>
					</nav>
				</aside>

				<!-- ============ RIGHT ============ -->
				<section class="mp2-right">
					<header class="mp2-head">
						<h1 class="mp2-title">비밀번호 변경</h1>
						<p class="mp2-sub">안전한 비밀번호로 계정을 보호하세요.</p>
					</header>

					<div class="mp2-body">

						<!-- ID line -->
						<div class="mp2-idLine">
							<span class="mp2-idLabel">ID</span>
							<span class="mp2-idValue"
										th:text="${profileMember != null ? profileMember.userId : ''}">
								아이디
							</span>
						</div>

						<form class="mp2-form" th:action="@{/mypage/password}" th:object="${member}" method="post" autocomplete="off">
							
							<div class="pw-center">
								<!-- 기존 비밀번호 -->
								<div class="mp2-row">
									<div class="mp2-rowLabel">기존 비밀번호</div>
	
									<div class="mp2-rowRight mp2-rightLine">
										<div class="mp2-field mp2-fieldNick" style="flex:1;">
											<i class="bi bi-key-fill mp2-ico"></i>
											<input class="mp2-input" type="password" th:field="*{currentPassword}" placeholder="비밀번호를 입력해주세요." minlength="4" required>
										</div>
	
										<button class="mp2-btn mp2-btnDup btn-ghost" type="button" id="btnCheckCurrentPw">
											확인
										</button>
									</div>
									
								</div>
								
								<!-- 서버 검증 메시지 -->
								<p class="mp2-msg" th:if="${#fields.hasErrors('currentPassword')}"
									 th:errors="*{currentPassword}" style="color:#e33;"></p>

								<!-- JS 안내 메시지 -->
								<p class="mp2-msg" id="currentPwMsg" style="display:none;"></p>
								<input type="hidden" id="currentPwOk" value="false">
	
								<!-- 새 비밀번호 -->
								<div class="mp2-row">
									<div class="mp2-rowLabel">새로운 비밀번호</div>
	
									<div class="mp2-rowRight">
										<div class="mp2-field mp2-fieldNick" style="flex:1;">
											<i class="bi bi-key-fill mp2-ico"></i>
											<input class="mp2-input" type="password" th:field="*{newPassword}"  placeholder="비밀번호를 입력해주세요." minlength="4" required>
										</div>
									</div>
	
									<p class="mp2-msg" th:if="${#fields.hasErrors('newPassword')}"
										 th:errors="*{newPassword}" style="color:#e33;"></p>
								</div>
	
								<!-- 새 비밀번호 확인 -->
								<div class="mp2-row">
									<div class="mp2-rowLabel">새 비밀번호 확인</div>
	
									<div class="mp2-rowRight">
										<div class="mp2-field mp2-fieldNick" style="flex:1;">
											<i class="bi bi-key-fill mp2-ico"></i>
											<input class="mp2-input" type="password"   th:field="*{confirmPassword}" placeholder="비밀번호 확인" minlength="4" required>
										</div>
									</div>
	
									<p class="mp2-msg" th:if="${#fields.hasErrors('confirmPassword')}"
										 th:errors="*{confirmPassword}" style="color:#e33;"></p>
	
									<p class="mp2-msg" id="confirmPwMsg" style="display:none;"></p>
								</div>
							</div>
							
							<div class="mp2-actions">
								<button class="btn-pill-orange" type="submit" id="btnChangePw">변경하기</button>
								<a class="btn-pill" th:href="@{/mypage}" role="button">취소</a>
							</div>

						</form>

						<!-- redirect 메시지 -->
						<input type="hidden" id="pageMsg" th:value="${msg}">
					</div>
				</section>
			</div>
		</section>
	</main>

	<!-- 공통 모달 -->
	<div th:replace="~{fragments/modal :: modal('saveModal', '알림')}"></div>

	<script th:src="@{/js/components/modal.js}"></script>
	<script>
		Modal.bind('#saveModal');
	</script>

	<script th:src="@{/js/member/password.js}"></script>
	<script th:src="@{/js/member/uploadProfile.js}"></script>

</th:block>
</html>
